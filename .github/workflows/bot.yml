name: bot

# Бесплатный always-on запуск бота на GitHub Actions (публичный репозиторий =
# безлимитные минуты). Схема: cron каждые 15 минут + concurrency-очередь —
# активная задача держит бота до 5ч50м (лимит раннера 6ч), следующая по очереди
# стартует сразу после завершения; cron страховает от крашей.

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

concurrency:
  group: telegram-bot
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      # API и сайт опубликованы публично (Tailscale Funnel → public-proxy.mjs,
      # см. README «Публичный доступ») — раннеру хватает обычного интернета.

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter "./packages/*" build

      - run: pnpm --filter @loki/bot build

      - name: run bot
        env:
          NODE_ENV: production
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          ADMIN_TG_IDS: ${{ secrets.ADMIN_TG_IDS }}
          API_URL: ${{ secrets.API_URL }}
          INTERNAL_TOKEN: ${{ secrets.INTERNAL_TOKEN }}
          WEB_URL: ${{ secrets.WEB_URL }}
          ALERT_CHAT_ID: ${{ secrets.ALERT_CHAT_ID }}
        run: pnpm exec tsx scripts/ci-run-bot.ts
