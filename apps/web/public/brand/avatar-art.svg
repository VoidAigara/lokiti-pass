<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <clipPath id="circ">
      <circle cx="120" cy="120" r="114"/>
    </clipPath>
    <linearGradient id="abg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C81B7A"/>
      <stop offset="1" stop-color="#8F1160"/>
    </linearGradient>
    <linearGradient id="ahair" gradientUnits="userSpaceOnUse" x1="0" y1="58" x2="0" y2="520">
      <stop offset="0" stop-color="#EA2E58"/>
      <stop offset="1" stop-color="#A51349"/>
    </linearGradient>
    <linearGradient id="askin" gradientUnits="userSpaceOnUse" x1="0" y1="136" x2="0" y2="344">
      <stop offset="0" stop-color="#F9DCEC"/>
      <stop offset="1" stop-color="#EFC3DA"/>
    </linearGradient>
    <pattern id="halftone" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="5" cy="5" r="3" fill="#DC5A9E" opacity="0.38"/>
      <circle cx="15" cy="15" r="3" fill="#DC5A9E" opacity="0.38"/>
    </pattern>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="1.4" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0.55 0"/>
    </filter>
  </defs>

  <g clip-path="url(#circ)">
    <!-- background -->
    <rect width="240" height="240" fill="url(#abg)"/>
    <g fill="#DA559F" opacity="0.3">
      <rect x="-40" y="-120" width="24" height="420" transform="rotate(28 0 0)"/>
      <rect x="160" y="-140" width="34" height="460" transform="rotate(28 0 0)"/>
    </g>
    <circle cx="124" cy="112" r="152" fill="#E23F93" opacity="0.32"/>
    <rect width="240" height="240" fill="url(#halftone)"/>
    <g fill="#2F3EC0" opacity="0.9">
      <rect x="12" y="146" width="17" height="6"/>
      <rect x="19" y="161" width="10" height="4" opacity="0.75"/>
      <rect x="210" y="96" width="15" height="5"/>
    </g>
    <g fill="#FFFFFF" opacity="0.16">
      <circle cx="30" cy="44" r="3"/><circle cx="210" cy="190" r="3"/><circle cx="46" cy="188" r="2.5"/>
    </g>
    <g stroke="#FFFFFF" stroke-width="3" fill="none" opacity="0.5">
      <path d="M196 44 c-5-7-14-5-14 3 c0 7 9 12 14 17 c5-5 14-10 14-17 c0-8-9-10-14-3z"/>
    </g>

    <!-- character: wink expression -->
    <g transform="translate(-51 6) scale(0.61)"
       stroke="#100815" stroke-linejoin="round" stroke-linecap="round">
      <!-- chroma under-stroke (electric blue rim) -->
      <g fill="none" stroke="#3A4EDD" stroke-width="18" stroke-linejoin="round" stroke-linecap="round">
        <path d="M280 58
                 C 186 58 132 126 134 212
                 C 135 264 124 306 116 520
                 L 444 520
                 C 436 306 425 264 426 212
                 C 428 126 374 58 280 58 Z"/>
        <path d="M282 64 C 287 54 293 48 303 44"/>
        <g transform="translate(306 34) rotate(10)">
          <path d="M0 10 C -11 1 -17 -6 -15 -12 C -13 -18 -6 -19 -2.5 -14 C -0.8 -16.5 2.5 -16.5 4 -14 C 8 -19 16 -18 17.5 -12 C 19 -6 12 1 0 10 Z"/>
        </g>
        <path d="M198 94 C 176 62 178 32 197 16 C 216 38 226 64 228 90 Z"/>
        <path d="M362 94 C 384 62 382 32 363 16 C 344 38 334 64 332 90 Z"/>
      </g>
      <path fill="url(#ahair)" stroke-width="6"
        d="M280 58
           C 186 58 132 126 134 212
           C 135 264 124 306 116 520
           L 444 520
           C 436 306 425 264 426 212
           C 428 126 374 58 280 58 Z"/>
      <!-- heart ahoge -->
      <path fill="none" stroke="#100815" stroke-width="7" d="M282 64 C 287 54 293 48 303 44"/>
      <g transform="translate(306 34) rotate(10)">
        <path fill="url(#ahair)" stroke="#100815" stroke-width="5.5"
          d="M0 10 C -11 1 -17 -6 -15 -12 C -13 -18 -6 -19 -2.5 -14 C -0.8 -16.5 2.5 -16.5 4 -14 C 8 -19 16 -18 17.5 -12 C 19 -6 12 1 0 10 Z"/>
      </g>
      <!-- deep hair tone on the right side -->
      <path stroke="none" fill="#7C0F45" opacity="0.85"
        d="M368 70 C 402 104 422 158 424 214 C 426 270 436 320 444 520 L 392 520 C 400 440 402 280 400 210 C 396 150 386 104 368 70 Z"/>
      <path fill="#1A0E22" stroke-width="6" d="M198 94 C 176 62 178 32 197 16 C 216 38 226 64 228 90 Z"/>
      <path fill="#1A0E22" stroke-width="6" d="M362 94 C 384 62 382 32 363 16 C 344 38 334 64 332 90 Z"/>

      <path fill="url(#askin)" stroke-width="6"
        d="M164 228
           C 164 176 218 140 280 140
           C 342 140 396 176 396 228
           C 396 266 388 298 366 318
           C 344 336 314 342 280 342
           C 246 342 216 336 194 318
           C 172 298 164 266 164 228 Z"/>
      <path fill="#DB93BA" opacity="0.85" stroke="none"
        d="M396 228 C 396 268 387 300 365 320 C 377 300 385 268 384 232 Z"/>
      <path fill="#DB93BA" opacity="0.65" stroke="none"
        d="M194 318 C 216 336 246 342 280 342 C 314 342 344 336 366 318 C 350 332 316 338 280 338 C 244 338 210 332 194 318 Z"/>

      <!-- forehead shadow under the fringe -->
      <path fill="none" stroke="#E7A9C6" stroke-width="16"
        d="M168 196 L202 212 L226 244 L254 208 L278 250 L306 206 L330 242 L356 210 L378 236 L396 204"/>

      <path fill="url(#ahair)" stroke-width="6" d="M172 188 C 158 240 158 296 170 520 L 208 520 C 192 300 190 240 200 196 Z"/>
      <path fill="url(#ahair)" stroke-width="6" d="M388 188 C 402 240 402 296 390 520 L 352 520 C 368 300 370 240 360 196 Z"/>

      <!-- left eye: playful wink (closed happy arc) -->
      <path d="M204 264 C 216 240 250 240 264 258" fill="none" stroke-width="9"/>
      <path d="M204 264 l-15 -11" fill="none" stroke-width="7"/>

      <!-- right eye: open, detailed -->
      <path fill="#22102A" stroke-width="5"
        d="M356 264 C 358 238 346 218 322 218 C 300 218 292 236 294 258 C 295 284 308 300 326 300 C 346 300 355 284 356 264 Z"/>
      <path d="M357 263 C 358 237 345 216 321 216 C 298 216 288 237 290 261" fill="none" stroke-width="9"/>
      <path d="M356 260 l15 -11" fill="none" stroke-width="7"/>
      <path d="M348 294 l9 7" fill="none" stroke-width="6"/>
      <g stroke="none">
        <path fill="#E02450" d="M349 275 C 344 296 306 297 299 273 C 306 282 315 285 324 285 C 334 285 344 281 349 275 Z"/>
        <ellipse cx="325" cy="255" rx="15" ry="17" fill="#16081A"/>
        <circle cx="340" cy="238" r="10" fill="#FFFFFF"/>
        <circle cx="305" cy="271" r="4.5" fill="#FFFFFF"/>
      </g>
      <path fill="url(#ahair)" stroke="none"
        d="M280 88
           C 212 88 170 130 168 196
           L 202 212 L 226 244 L 254 208 L 278 250 L 306 206 L 330 242 L 356 210 L 378 236 L 396 204
           C 394 132 348 88 280 88 Z"/>
      <path fill="none" stroke-width="6"
        d="M168 196 L202 212 L226 244 L254 208 L278 250 L306 206 L330 242 L356 210 L378 236 L396 204"/>

      <path stroke="none" fill="#FFFFFF" opacity="0.26"
        d="M204 142 C 240 112 330 108 364 136 C 354 128 328 120 298 122 C 258 124 222 132 204 142 Z"/>
      <path stroke="none" fill="#FFFFFF" opacity="0.2"
        d="M226 168 C 224 186 228 202 234 214 C 238 204 236 186 240 170 Z"/>
      <g stroke="#A51349" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.85">
        <path d="M212 116 C 204 140 201 162 203 184"/>
        <path d="M348 116 C 356 140 359 162 357 184"/>
        <path d="M276 102 C 274 116 274 126 276 136"/>
      </g>


      <!-- blush -->
      <g stroke="none" fill="#EC7FB1" opacity="0.95">
        <ellipse cx="186" cy="302" rx="16" ry="8"/>
        <ellipse cx="376" cy="302" rx="16" ry="8"/>
      </g>
      <g stroke="#D25288" stroke-width="3.5" fill="none" opacity="0.95">
        <path d="M177 296 l-3 11 M187 294 l-3 12 M197 296 l-3 11"/>
        <path d="M367 296 l-3 11 M377 294 l-3 12 M387 296 l-3 11"/>
      </g>

      <!-- mouth: open grin with fang -->
      <path d="M260 304 C 264 330 302 330 306 304 Z" fill="#251530" stroke-width="6"/>
      <path d="M267 305 L275 305 L271 315 Z" fill="#FFFFFF" stroke="#100815" stroke-width="3" stroke-linejoin="round"/>

      <!-- clips -->
      <path fill="#CBE3F5" stroke-width="5"
        d="M196 158 l9 20 22 3-16 15 4 22-19-10-19 10 4-22-16-15 22-3z"/>
      <g stroke="#2F3EC0" stroke-width="9" stroke-linecap="round" transform="rotate(8 358 154)">
        <path d="M346 142 l24 24 M370 142 l-24 24"/>
      </g>
      <g transform="translate(380 216) rotate(14)">
        <path fill="#F0B4CF" stroke-width="5" stroke-linejoin="round"
          d="M0 12 C -14 2 -22 -6 -20 -14 C -18 -21 -8 -22 -3 -16 C -1 -19 3 -19 5 -16 C 10 -22 20 -21 22 -14 C 24 -6 16 2 0 12 Z"/>
      </g>
    </g>

    <rect width="240" height="240" filter="url(#grain)" opacity="0.17" style="mix-blend-mode:overlay"/>
    <!-- sparkles over bg -->
    <path d="M206 156 l4 10 10 4-10 4-4 10-4-10-10-4 10-4z" fill="#4E97E8" stroke="#100815" stroke-width="3"/>
    <path d="M30 128 l4 10 10 4-10 4-4 10-4-10-10-4 10-4z" fill="#CDE7FA" stroke="#100815" stroke-width="3"/>
  </g>
  <circle cx="120" cy="120" r="116" fill="none" stroke="#100815" stroke-width="8"/>
</svg>
